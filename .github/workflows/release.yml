name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Select release jar
        id: jar
        run: |
          jar="$(find build/libs -name 'armourstats-*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' | head -n 1)"
          if [ -z "${jar}" ]; then
            echo "No release jar found in build/libs" >&2
            ls -la build/libs >&2 || true
            exit 1
          fi
          echo "path=${jar}" >> "${GITHUB_OUTPUT}"
          echo "Selected ${jar}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
